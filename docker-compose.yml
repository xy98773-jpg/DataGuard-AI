# Optional: local simulation of production dependencies.
#
# NOT required for local lightweight development — the app runs fine with
# SQLite + local object storage + cloud LLM API. Start these only when you
# want to exercise the production architecture locally:
#
#   docker compose up -d postgres redis minio
#
# Then set in backend/.env:
#   DG_DATABASE_URL=postgresql+psycopg://dataguard:dataguard@localhost:5432/dataguard
#   DG_REDIS_URL=redis://localhost:6379/0
#   DG_OBJECT_STORAGE_BACKEND=s3
#   DG_S3_ENDPOINT_URL=http://localhost:9000
#   DG_S3_ACCESS_KEY=minioadmin
#   DG_S3_SECRET_KEY=minioadmin
#   DG_S3_BUCKET=dataguard
#   (pip install boto3 psycopg[binary])

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard
      POSTGRES_DB: dataguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
