# ============================================================
# DataGuard AI — Docker Compose 编排
# 用法：
#   docker compose up -d --build            # 启动（backend + frontend）
#   docker compose --profile db up -d       # 需要数据库源时额外启动 MySQL
#   docker compose down                     # 停止（数据保留在 docker-storage/）
# 访问：http://localhost:8080
# ============================================================
name: dgai

services:
  backend:
    build: ./backend
    image: dgai-backend:latest
    container_name: dgai-backend
    ports:
      - "8010:8000"            # 外部 8010（避开本地 dev 的 8000）；用户入口仍是 8080
    env_file:
      - ./backend/.env          # LLM Key 等（.env 不进 git，部署者自填）
    volumes:
      - ./docker-storage:/app/storage   # 数据卷（独立于本地 dev 的 storage/）
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: dgai-frontend:latest
    container_name: dgai-frontend
    ports:
      - "8080:80"               # 对外访问入口
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: dgai-mysql
    profiles: ["db"]            # 可选：注册数据库数据集时才需要
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dataguard
    ports:
      - "3307:3306"             # 避开本机 3306（dg-mysql）
    volumes:
      - dgai_mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  dgai_mysql_data:
